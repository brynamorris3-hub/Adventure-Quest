<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Adventure Quest</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(#dff4ff, #fff3d6);
      min-height: 100vh;
      margin: 0;
      padding: 30px 15px;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 5px;
    }

    .subtitle {
      font-size: 20px;
      margin-bottom: 35px;
    }

    .mission {
      background: white;
      max-width: 400px;
      margin: 15px auto;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.12);
    }

    button {
      font-size: 20px;
      padding: 15px 25px;
      margin: 8px;
      border: none;
      border-radius: 15px;
      cursor: pointer;
    }

    .morning {
      background: #ffe36e;
    }

    .evening {
      background: #b9b8ff;
    }

    .tidy {
      background: #9ee7b7;
    }
  </style>
</head>

<body>

  <h1>🌈 Adventure Quest</h1>
  <div class="subtitle">Ready for your next adventure?</div>

  <div class="mission">
    <h2>🌞 Morning Mission</h2>
    <button class="morning">Start Morning Mission</button>
  </div>

  <div class="mission">
    <h2>🧹 Tidy Mission</h2>
    <p>8-Minute Challenge</p>
    <button class="tidy">Start Tidy Mission</button>
  </div>

  <div class="mission">
    <h2>🌙 Evening Mission</h2>
    <button class="evening">Start Evening Mission</button>
  </div>

</body>
</html>
